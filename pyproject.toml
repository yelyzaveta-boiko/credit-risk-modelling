[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-modeling"
version = "0.1.0"
description = "PD and LGD estimation using statistical and machine learning methods, consistent with Basel II/III framework"
authors = [{ name = "Yelyzaveta Boiko" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core data handling
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Modeling
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.0",   # for LGD regression diagnostics
    "joblib>=1.3.0",   # model persistence

    # Interpretability
    "shap>=0.45.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Notebooks
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",

    # Config / env management
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "optbinning>=0.20.0",  # reference implementation for the build-vs-buy binning benchmark
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # pyflakes, pycodestyle, isort, warnings

[tool.pytest.ini_options]
testpaths = ["tests"]